# Local hooks use the tool versions pinned in requirements-dev.txt,
# so pre-commit, CI and manual runs always check with the same versions.
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: .venv/bin/ruff format
        language: system
        types_or: [python, pyi]
      - id: ruff-check
        name: ruff check
        entry: .venv/bin/ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: mypy
        entry: .venv/bin/mypy .
        language: system
        types_or: [python, pyi]
        pass_filenames: false
