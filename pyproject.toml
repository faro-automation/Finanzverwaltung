[project]
name = "finanzverwaltung"
version = "0.1.0"
description = "Manage bank accounts and cash reserves and assign them to purposes."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "mypy",
    "pip-tools",
    "pre-commit",
    "pytest",
    "ruff",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting
    "N",    # naming conventions
    "UP",   # modern Python syntax
    "B",    # likely bugs
    "SIM",  # simplifications
    "C90",  # cyclomatic complexity
    "ANN",  # missing type annotations
    "PL",   # pylint rules
    "RUF",  # ruff-specific rules
]
ignore = [
    "PLR0913",  # no fixed limit on the number of parameters
    "PLR0917",  # no fixed limit on the number of positional parameters
]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
# Enforces the single-return rule from CLAUDE.md.
max-returns = 1

[tool.ruff.lint.per-file-ignores]
# Tests compare against literal expected values.
"tests/**" = ["PLR2004"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--strict-markers"]
